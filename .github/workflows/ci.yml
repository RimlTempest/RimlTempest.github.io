name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: install
        run: bun install --frozen-lockfile

      - name: build design system (vendor/riml-ds)
        run: bun run sync:ds

      - name: check (format / lint / stylelint / typecheck)
        run: bun run check

      - name: test
        run: bun test src

      - name: build
        run: bun run build

      - name: build storybook
        run: bun run storybook:build
